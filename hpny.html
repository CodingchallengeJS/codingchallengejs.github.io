<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2026</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Playfair Display", serif;
}

html {
  scroll-behavior: smooth;
}

/* ================= HERO SECTION ================= */

.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
  color: gold;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

/* Background video */
#bgVideo {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  object-position: center center;
  filter: blur(6px) brightness(0.5);
  z-index: -2;
}

/* Firework canvas */
#fireworks {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* Title */
.hero h1 {
  font-size: 5rem;
  background: linear-gradient(45deg, gold, #ffdf6b);
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 0 30px rgba(255,215,0,0.7);
}

.hero p {
  font-size: 1.5rem;
  margin-top: 10px;
}

/* Scroll button */
.scroll-down {
  position: absolute;
  bottom: 30px;
  font-size: 2.5rem;
  cursor: pointer;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(10px); }
}

/* ================= SECTION 2 ================= */

.section2 {
  min-height: 100vh;
  background: #8B0000;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 100px;
  color: gold;
}

.section2 h2 {
  font-size: 3rem;
  margin-bottom: 80px;
}

.lixi-container {
  display: flex;
  gap: 50px;
}

.lixi {
  width: 120px;
  height: 200px;
  background: linear-gradient(#c40000, #8b0000);
  border-radius: 12px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
  cursor: pointer;
  transition: 0.3s;
  position: relative;
}

.lixi:hover {
  transform: translateY(-15px) scale(1.08);
}

.lixi::before {
  content: "🧧";
  font-size: 4rem;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Result popup */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 2rem;
  text-align: center;
}

.popup-content {
  background: #b30000;
  padding: 40px 60px;
  border-radius: 20px;
  box-shadow: 0 0 30px gold;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

.close-btn {
  margin-top: 20px;
  font-size: 1rem;
  cursor: pointer;
  color: gold;
}
</style>
</head>

<body>

<!-- Background video -->
<video autoplay muted loop playsinline id="bgVideo">
  <source src="firework.mp4" type="video/mp4">
</video>

<!-- Fireworks Canvas -->
<canvas id="fireworks"></canvas>

<!-- Music -->
<audio id="bgMusic" loop>
  <source src="tiptoe.mp3" type="audio/mp3">
</audio>

<!-- HERO -->
<section class="hero">
  <h1>2026</h1>
  <p>Happy New Year</p>
  <p>Xin chào Bính Ngọ🐴</p>
  <div class="scroll-down">↓</div>
</section>

<!-- SECTION 2 -->
<section class="section2">
  <h2>Chọn lì xì của bạn</h2>
  <div class="lixi-container">
    <div class="lixi"></div>
    <div class="lixi"></div>
    <div class="lixi"></div>
    <div class="lixi"></div>
    <div class="lixi"></div>
  </div>
</section>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <p>🎉 Chúc bạn may mắn lần sau =)) 🎉</p>
    <p>Bù lại có lời chúc tinh thần</p>
    <p>Happy new year</p>
    <p>新年快乐</p>
    <p>Năm mới vui vẻ</p>
    <div class="close-btn">Đóng</div>
  </div>
</div>

<script>

window.addEventListener("click", function() {
  document.getElementById("bgMusic").play();
}, { once: true });

document.querySelector(".scroll-down").onclick = () => {
  window.scrollTo({
    top: window.innerHeight,
    behavior: "smooth"
  });
};

const popup = document.getElementById("popup");

document.querySelectorAll(".lixi").forEach(lixi => {
  lixi.onclick = () => {
    popup.style.display = "flex";
  };
});

document.querySelector(".close-btn").onclick = () => {
  popup.style.display = "none";
};

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
let rockets = [];
const FIREWORK_INTERVAL = 900;
let lastFireworkTime = 0;
let lastFrameTime = performance.now();
const GRAVITY = 380;
const PARTICLE_GRAVITY = 140;

function createFirework() {
  const x = Math.random() * canvas.width;
  const color = `hsl(${Math.random() * 360}, 100%, 55%)`;

  rockets.push({
    x,
    y: canvas.height + 10,
    vx: 0,
    vy: -(Math.random() * 120 + 560),
    ax: 0,
    ay: GRAVITY,
    color,
    trail: []
  });
}

function explodeFirework(x, y, color) {
  const maxRadius = 110;
  const spacing = 14;
  const ringCount = Math.floor(maxRadius / spacing);
  const edgeSpeed = Math.random() * 18 + 185;

  for (let ring = 0; ring <= ringCount; ring++) {
    const radius = ring * spacing;
    const ringRatio = radius / maxRadius;
    const basePoints = ring === 0 ? 1 : Math.max(6, Math.round((2 * Math.PI * radius) / spacing));
    const points = ring === ringCount ? basePoints * 1.5 : basePoints;

    for (let i = 0; i < points; i++) {
      const thetaBase = (i / points) * 2 * Math.PI;
      const theta = thetaBase + (ring % 2 === 0 ? 0 : Math.PI / points);
      const speed = Math.max(20, edgeSpeed * ringRatio);
      const baseAlpha = 0.32 + 0.68 * Math.pow(ringRatio, 1.35);

      particles.push({
        x,
        y,
        vx: speed * Math.cos(theta),
        vy: speed * Math.sin(theta),
        ax: 0,
        ay: PARTICLE_GRAVITY,
        baseSize: 1.4 + ringRatio * 1.1,
        baseAlpha,
        color,
        drag: 0.988,
        age: 0,
        holdDuration: 1,
        fadeAge: 0,
        fadeDuration: Math.random() * 0.45 + 0.75,
        alpha: 1,
        scale: 1
      });
    }
  }
}

function animate(now = 0) {
  requestAnimationFrame(animate);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const dt = Math.min((now - lastFrameTime) / 1000, 0.033);
  lastFrameTime = now;

  if (document.visibilityState === "visible" && now - lastFireworkTime >= FIREWORK_INTERVAL) {
    createFirework();
    lastFireworkTime = now;
  }

  for (let i = rockets.length - 1; i >= 0; i--) {
    const rocket = rockets[i];
    rocket.vx += rocket.ax * dt;
    rocket.vy += rocket.ay * dt;
    rocket.x += rocket.vx * dt;
    rocket.y += rocket.vy * dt;
    rocket.trail.push({ x: rocket.x, y: rocket.y });
    if (rocket.trail.length > 14) rocket.trail.shift();

    if (rocket.vy >= 0) {
      explodeFirework(rocket.x, rocket.y, rocket.color);
      rockets.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    for (let i = 0; i < rocket.trail.length; i++) {
      const t = rocket.trail[i];
      if (i === 0) ctx.moveTo(t.x, t.y);
      else ctx.lineTo(t.x, t.y);
    }
    ctx.strokeStyle = rocket.color;
    ctx.lineWidth = 2;
    ctx.shadowColor = rocket.color;
    ctx.shadowBlur = 12;
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(rocket.x, rocket.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = rocket.color;
    ctx.shadowColor = rocket.color;
    ctx.shadowBlur = 20;
    ctx.fill();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vx += p.ax * dt;
    p.vy += p.ay * dt;
    p.vx *= p.drag;
    p.vy *= p.drag;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.age += dt;

    if (p.age >= p.holdDuration) {
      p.fadeAge += dt;
      const fadeProgress = Math.min(p.fadeAge / p.fadeDuration, 1);
      p.alpha = 1 - fadeProgress;
      p.scale = 1 - fadeProgress;
    } else {
      p.alpha = 1;
      p.scale = 1;
    }

    if (p.scale <= 0) {
      particles.splice(i,1);
      continue;
    }

    ctx.globalAlpha = p.alpha * p.baseAlpha;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.baseSize * p.scale,0,Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 18;
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    lastFireworkTime = performance.now();
  }
});

lastFireworkTime = performance.now();
lastFrameTime = performance.now();
animate();

</script>

</body>
</html>
